name: MurphPlus
options:
  bundleIdPrefix: com.projectnemeth
  deploymentTarget:
    iOS: "17.0"
targets:
  MurphPlus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MurphPlus
      - MurphCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectnemeth.MurphPlus
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "Murph Plus"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MurphPlus/Info.plist
      properties:
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - DMSans-Variable.ttf
          - MartianMono-Variable.ttf
  MurphPlusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MurphPlusTests
    dependencies:
      - target: MurphPlus
    settings:
      base:
        # Required: without it the test bundle fails to code sign with
        # "target does not have an Info.plist file and one is not being
        # generated automatically". The app target is not enough — the test
        # bundle needs its own.
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
schemes:
  MurphPlus:
    build:
      targets:
        MurphPlus: all
        MurphPlusTests: [test]
    test:
      targets:
        - MurphPlusTests
    run:
      config: Debug
