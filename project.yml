name: MurphPlus
options:
  bundleIdPrefix: com.projectnemeth
  deploymentTarget:
    iOS: "17.0"
targets:
  MurphPlus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MurphPlus
      - MurphCore
      # Compiled into the phone app purely so the iOS test bundle can reach it:
      # `WatchSessionController` is Foundation + Observation only (it talks to
      # HealthKit through the `WorkoutControlling` seam, never to HealthKit
      # itself), and the watch target has no test bundle of its own. It is not
      # referenced by any phone UI.
      - path: MurphPlusWatch/Session/WatchSessionController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectnemeth.MurphPlus
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "Murph Plus"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Murph+ uses location during the two runs to measure distance and pace. Choose Indoor at setup to skip this."
    info:
      path: MurphPlus/Info.plist
      properties:
        # Setting `CLLocationManager.allowsBackgroundLocationUpdates = true`
        # while this key is missing is documented as "a fatal error that
        # terminates the app" - NSInternalInconsistencyException, "Invalid
        # parameter not satisfying: !stayUp || CLClientIsBackgroundable(...)".
        # It ships in the same commit as that property for exactly that reason.
        #
        # Leaving the property false is not a safe middle: updates then "may or
        # may not continue in the background", which is the silent undercount
        # this feature exists to remove. A pocketed phone with a locked screen
        # is the normal case for a run.
        UIBackgroundModes:
          - location
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - DMSans-Variable.ttf
          - MartianMono-Variable.ttf
    dependencies:
      - target: MurphPlusWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
  MurphPlusWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - MurphPlusWatch
      - MurphCore
      - path: MurphPlus/DesignSystem/Foundations
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectnemeth.MurphPlus.watchkitapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Murph+"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.projectnemeth.MurphPlus
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Murph+ reads your heart rate and distance during a workout so your session records what your body actually did."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Murph+ saves your Murph as a workout so it counts toward your Activity rings."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Murph+ uses location during the two runs to measure distance and pace. Choose Indoor at setup to skip this."
    # Without `com.apple.developer.healthkit` every HealthKit call fails with
    # "Missing com.apple.developer.healthkit entitlement". Critically,
    # `HKWorkoutSession.init` still SUCCEEDS, so the defensive catch in
    # `WorkoutSessionController.start` never fires — instead HealthKit's task
    # server never starts and `builder.beginCollection` never calls back, so
    # `startSession` awaits forever and the app is stuck on the setup screen.
    entitlements:
      path: MurphPlusWatch/MurphPlusWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: MurphPlusWatch/Info.plist
      properties:
        # Without `workout-processing` watchOS suspends the app the moment the
        # wrist drops. The `HKWorkoutSession` survives system-side, but
        # `HKLiveWorkoutBuilderDelegate` stops firing, so no heart-rate event
        # reaches the journal for the rest of the workout and the live view
        # freezes. This is a plist key only — no portal capability required.
        WKBackgroundModes:
          - workout-processing
        # A *different* key doing a *different* job, and both are required.
        # `WKBackgroundModes` has no `location` value at all — its full set is
        # workout-processing, self-care, mindfulness, physical-therapy, alarm,
        # underwater-depth — and `workout-processing` covers only the workout
        # session. Location on watchOS goes through `UIBackgroundModes`, which
        # is available here (watchOS 4.0+).
        #
        # This is not optional hardening: setting
        # `CLLocationManager.allowsBackgroundLocationUpdates = true` while this
        # key is missing is documented as "a fatal error that terminates the
        # app" — NSInternalInconsistencyException, "Invalid parameter not
        # satisfying: !stayUp || CLClientIsBackgroundable(...)". And leaving
        # that property false is not a safe middle: updates then "may or may
        # not continue in the background", which is the silent undercount this
        # whole feature exists to remove.
        UIBackgroundModes:
          - location
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - DMSans-Variable.ttf
          - MartianMono-Variable.ttf
  MurphPlusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MurphPlusTests
    dependencies:
      - target: MurphPlus
    settings:
      base:
        # Required: without it the test bundle fails to code sign with
        # "target does not have an Info.plist file and one is not being
        # generated automatically". The app target is not enough — the test
        # bundle needs its own.
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
schemes:
  MurphPlus:
    build:
      targets:
        MurphPlus: all
        MurphPlusTests: [test]
    test:
      targets:
        - MurphPlusTests
    run:
      config: Debug
  MurphPlusWatch:
    build:
      targets:
        MurphPlusWatch: all
    run:
      config: Debug
