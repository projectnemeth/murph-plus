name: MurphPlus
options:
  bundleIdPrefix: com.projectnemeth
  deploymentTarget:
    iOS: "17.0"
targets:
  MurphPlus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MurphPlus
      - MurphCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectnemeth.MurphPlus
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "Murph Plus"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MurphPlus/Info.plist
      properties:
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - DMSans-Variable.ttf
          - MartianMono-Variable.ttf
    dependencies:
      - target: MurphPlusWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
  MurphPlusWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - MurphPlusWatch
      - MurphCore
      - path: MurphPlus/DesignSystem/Foundations
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectnemeth.MurphPlus.watchkitapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Murph+"
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.projectnemeth.MurphPlus
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Murph+ reads your heart rate and distance during a workout so your session records what your body actually did."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Murph+ saves your Murph as a workout so it counts toward your Activity rings."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Murph+ uses location during the two runs to measure distance and pace. Choose Indoor at setup to skip this."
    info:
      path: MurphPlusWatch/Info.plist
      properties:
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - DMSans-Variable.ttf
          - MartianMono-Variable.ttf
  MurphPlusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MurphPlusTests
    dependencies:
      - target: MurphPlus
    settings:
      base:
        # Required: without it the test bundle fails to code sign with
        # "target does not have an Info.plist file and one is not being
        # generated automatically". The app target is not enough — the test
        # bundle needs its own.
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
schemes:
  MurphPlus:
    build:
      targets:
        MurphPlus: all
        MurphPlusTests: [test]
    test:
      targets:
        - MurphPlusTests
    run:
      config: Debug
  MurphPlusWatch:
    build:
      targets:
        MurphPlusWatch: all
    run:
      config: Debug
